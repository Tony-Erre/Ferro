<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="description" content="Diario allenamenti offline per forza e ipertrofia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ferro — Diario allenamenti</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#22252c;--line:#343842;--text:#f5f6f8;--muted:#a4a9b4;--accent:#b9f36b;--accent2:#d7ffa0;--danger:#ff7777;--radius:18px}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 14px;background:var(--panel2);color:var(--text);font-weight:650}button:active{transform:scale(.98)}button.primary{background:var(--accent);color:#171a12}button.ghost{background:transparent;border:1px solid var(--line)}button.danger{color:var(--danger);border:1px solid #713c43;background:#2a1b20}.small{padding:8px 10px;font-size:13px}.muted{color:var(--muted)}.tiny{font-size:12px}.wrap{max-width:720px;margin:0 auto;padding:0 16px}.top{padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;background:rgba(16,17,20,.94);backdrop-filter:blur(16px);z-index:5;border-bottom:1px solid #252830}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--accent)}.date-label{font-size:12px;color:var(--muted);margin-top:2px}.status{font-size:11px;color:var(--accent);border:1px solid #425a2a;border-radius:99px;padding:5px 8px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0 20px}.tab{font-size:13px;padding:10px 4px;color:var(--muted);background:transparent;border:1px solid var(--line)}.tab.active{background:var(--accent);border-color:var(--accent);color:#171a12}.section-title{font-size:24px;letter-spacing:-.6px;margin:10px 0 4px}.sub{color:var(--muted);font-size:14px;margin:0 0 16px}.card{background:var(--panel);border:1px solid #292d35;border-radius:var(--radius);padding:16px;margin:12px 0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea,input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:#111317;color:var(--text);padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.exercise-name{font-size:18px;font-weight:800}.tag{font-size:11px;color:var(--accent);background:#28351d;border-radius:8px;padding:4px 7px}.exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.set-head,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 36px;gap:7px;align-items:center}.set-head{font-size:11px;color:var(--muted);padding:12px 2px 5px}.set-row{margin:6px 0}.set-number{color:var(--muted);font-size:13px;text-align:center}.set-row input{padding:10px 6px;text-align:center;font-size:15px}.done-btn{padding:8px 0;background:#292d35;color:var(--muted)}.done-btn.done{background:var(--accent);color:#171a12}.exercise-footer{display:flex;gap:8px;margin-top:10px}.exercise-footer button{flex:1}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:13px}.pill.selected{border-color:var(--accent);background:#28351d;color:var(--accent)}.metric{background:var(--panel);border:1px solid #292d35;border-radius:15px;padding:13px}.metric strong{display:block;font-size:22px;letter-spacing:-.6px}.metric span{font-size:12px;color:var(--muted)}.bottomnav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(24,26,31,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bottomnav button{background:transparent;color:var(--muted);padding:8px 3px;font-size:11px}.bottomnav button.active{color:var(--accent)}.bottomnav b{display:block;font-size:19px;margin-bottom:2px}.empty{text-align:center;padding:28px 15px;color:var(--muted)}.empty .emoji{font-size:32px;margin-bottom:8px}.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#222b1b;border:1px solid #425a2a;padding:14px;border-radius:15px;margin:12px 0}.timer-time{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--accent)}.bar{height:8px;border-radius:99px;background:#30343d;overflow:hidden}.bar>div{height:100%;background:var(--accent);width:0;transition:width .2s}.chartbox{background:var(--panel);border:1px solid #292d35;border-radius:18px;padding:14px;margin:12px 0}.chartbox svg{width:100%;height:auto;display:block}.history-item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-item strong{display:block}.toast{position:fixed;z-index:20;bottom:100px;left:50%;transform:translateX(-50%);background:#e9ffd0;color:#151a10;border-radius:99px;padding:10px 16px;font-weight:750;font-size:13px;box-shadow:0 8px 28px #0008;display:none;max-width:90%;text-align:center}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.5}.separator{height:1px;background:var(--line);margin:14px 0}.template-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.template-row:last-child{border:0}.filelabel{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);padding:12px 14px;border-radius:13px;font-weight:650;cursor:pointer;background:var(--panel2)}@media(min-width:600px){.wrap{padding:0 22px}.tabs{max-width:480px}.card{padding:20px}.set-head,.set-row{grid-template-columns:44px 1fr 1fr 44px}}
</style>
</head>
<body>
<header class="top"><div class="wrap toprow"><div><div class="brand">FERRO<span>.</span></div><div class="date-label" id="todayLabel">Il tuo diario di allenamento</div></div><div class="status">● SALVATO IN LOCALE</div></div></header>
<main class="wrap" id="app"></main>
<nav class="bottomnav">
<button data-page="workout" class="active"><b>＋</b>Allenamento</button>
<button data-page="plans"><b>▤</b>Schede</button>
<button data-page="progress"><b>↗</b>Progressi</button>
<button data-page="history"><b>◷</b>Storico</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const defaultState={
 plans:[
  {id:"A",name:"Scheda A",exercises:[{id:uid(),name:"Panca piana",sets:3,reps:"8-10",rest:120},{id:uid(),name:"Rematore",sets:3,reps:"8-12",rest:90},{id:uid(),name:"Squat",sets:3,reps:"6-10",rest:150}]},
  {id:"B",name:"Scheda B",exercises:[{id:uid(),name:"Stacco rumeno",sets:3,reps:"8-10",rest:120},{id:uid(),name:"Military press",sets:3,reps:"8-10",rest:90},{id:uid(),name:"Lat machine",sets:3,reps:"10-12",rest:90}]},
  {id:"C",name:"Scheda C",exercises:[{id:uid(),name:"Leg press",sets:3,reps:"10-12",rest:120},{id:uid(),name:"Chest press",sets:3,reps:"8-12",rest:90},{id:uid(),name:"Pulley",sets:3,reps:"10-12",rest:90}]}
 ],
 sessions:[], active:null, selectedPlan:"A", timerEnd:null, timerDuration:90, historyFilter:"all"
};
let state=loadState(), page="workout", timerInterval=null, editPlanId=null;
function loadState(){try{const s=JSON.parse(localStorage.getItem("ferroState"));return s?{...structuredClone(defaultState),...s}:structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem("ferroState",JSON.stringify(state));}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"})}
function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2300)}
function currentPlan(){return state.plans.find(p=>p.id===state.selectedPlan)||state.plans[0]}
function lastSet(exName){for(let i=state.sessions.length-1;i>=0;i--){let e=state.sessions[i].exercises?.find(x=>x.name===exName);if(e){let s=[...(e.sets||[])].reverse().find(s=>s.weight!==""||s.reps!=="");if(s)return s}}return null}
function createSession(plan){return {id:uid(),date:today(),planId:plan.id,planName:plan.name,startedAt:new Date().toISOString(),endedAt:null,sleep:3,energy:3,notes:"",exercises:plan.exercises.map(e=>({id:e.id,name:e.name,plannedSets:Number(e.sets)||3,targetReps:e.reps||"",rest:Number(e.rest)||90,sets:Array.from({length:Number(e.sets)||3},()=>({weight:"",reps:"",rir:"2",effort:"3",technique:"Buona",feeling:"Stabile",done:false}))}))}}
function ensureActive(){if(!state.active){const p=currentPlan();state.active=createSession(p);save()}}
function activeVolume(s){return (s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,x)=>b+(Number(x.weight)||0)*(Number(x.reps)||0),0),0)}
function totalReps(s){return (s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,x)=>b+(Number(x.reps)||0),0),0)}
function doneSets(s){return (s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).filter(x=>x.done).length,0)}
function allSets(s){return (s.exercises||[]).reduce((a,e)=>a+e.sets.length,0)}
function setPage(p){page=p;document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".bottomnav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
function render(){if(page==="workout")renderWorkout();else if(page==="plans")renderPlans();else if(page==="progress")renderProgress();else renderHistory()}
function renderWorkout(){
 if(state.active===null){const p=currentPlan();$("#app").innerHTML=`<div class="section-title">Pronto a spingere?</div><p class="sub">Scegli la scheda e inizia. I tuoi dati restano su questo dispositivo.</p><div class="card"><div class="field"><label>ALLENAMENTO</label><select id="planPick">${state.plans.map(p=>`<option value="${esc(p.id)}" ${p.id===state.selectedPlan?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="separator"></div><div class="row between"><div><strong>${esc(p.name)}</strong><div class="muted tiny">${p.exercises.length} esercizi · scheda personalizzabile</div></div><span class="tag">FORZA / IPERTROFIA</span></div><div class="stack" style="margin-top:12px">${p.exercises.length?p.exercises.map(e=>`<div class="row between"><span>${esc(e.name)}</span><span class="muted tiny">${e.sets} × ${esc(e.reps)}</span></div>`).join(""):'<div class="empty">Aggiungi gli esercizi nella sezione Schede.</div>'}</div><button class="primary" style="width:100%;margin-top:18px" id="startWorkout">Inizia allenamento →</button></div><div class="grid2"><div class="metric"><strong>${state.sessions.length}</strong><span>allenamenti salvati</span></div><div class="metric"><strong>${state.sessions.reduce((a,s)=>a+doneSets(s),0)}</strong><span>serie completate</span></div></div><p class="note">Le schede iniziali sono solo esempi: sostituiscile con quelle del tuo personal trainer prima di usarle.</p>`;
 $("#planPick").onchange=e=>{state.selectedPlan=e.target.value;save();renderWorkout()};$("#startWorkout").onclick=()=>{if(!p.exercises.length){toast("Aggiungi almeno un esercizio alla scheda");return}state.active=createSession(currentPlan());save();renderWorkout()};return}
 const s=state.active,done=doneSets(s),total=allSets(s),vol=activeVolume(s);
 $("#app").innerHTML=`<div class="row between" style="margin-top:16px"><div><div class="section-title" style="margin:0">${esc(s.planName)}</div><p class="sub" style="margin:3px 0 0">${fmtDate(s.date)} · allenamento in corso</p></div><button class="ghost small" id="cancelSession">Annulla</button></div>
 <div class="grid2"><div class="metric"><strong>${done}/${total}</strong><span>serie completate</span><div class="bar" style="margin-top:9px"><div style="width:${total?done/total*100:0}%"></div></div></div><div class="metric"><strong>${Math.round(vol).toLocaleString("it-IT")}</strong><span>volume registrato · kg</span></div></div>
 <div class="timer"><div><div class="tiny muted">RECUPERO</div><div class="timer-time" id="timerTime">--:--</div><div class="tiny muted" id="timerHint">Avvia il timer tra le serie</div></div><div class="stack" style="min-width:118px"><div class="row"><button class="small" data-timer="60">60s</button><button class="small" data-timer="90">90s</button><button class="small" data-timer="120">120s</button></div><button class="primary small" id="timerStart">Avvia / riparti</button></div></div>
 ${s.exercises.map((e,ei)=>`<div class="card" data-ex="${ei}"><div class="exercise-head"><div><div class="exercise-name">${esc(e.name)}</div><div class="muted tiny">${e.plannedSets} serie previste · target ${esc(e.targetReps||"libero")} rip. · recupero ${e.rest}s</div></div><span class="tag">${e.sets.filter(x=>x.done).length}/${e.sets.length}</span></div><div class="set-head"><span>SERIE</span><span>CARICO kg</span><span>REPS</span><span>✓</span></div>${e.sets.map((x,si)=>`<div class="set-row"><div class="set-number">${si+1}</div><input aria-label="Carico serie ${si+1}" inputmode="decimal" type="number" min="0" step="0.5" placeholder="${lastSet(e.name)?.weight||"kg"}" data-e="${ei}" data-s="${si}" data-k="weight" value="${esc(x.weight)}"><input aria-label="Ripetizioni serie ${si+1}" inputmode="numeric" type="number" min="0" step="1" placeholder="reps" data-e="${ei}" data-s="${si}" data-k="reps" value="${esc(x.reps)}"><button class="done-btn ${x.done?"done":""}" data-done="${ei},${si}" aria-label="Completa serie">${x.done?"✓":"○"}</button></div><div class="${x.done?"":"hidden"}" style="padding:4px 0 9px 41px"><div class="grid2"><div class="field"><label>RIR</label><select data-e="${ei}" data-s="${si}" data-k="rir">${["0","1","2","3","4","5+"].map(v=>`<option ${x.rir===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>SFORZO (1–5)</label><select data-e="${ei}" data-s="${si}" data-k="effort">${[1,2,3,4,5].map(v=>`<option value="${v}" ${String(x.effort)===String(v)?"selected":""}>${v}${v===1?" facile":v===5?" massimo":""}</option>`).join("")}</select></div><div class="field"><label>TECNICA</label><select data-e="${ei}" data-s="${si}" data-k="technique">${["Ottima","Buona","Da curare","Compromessa"].map(v=>`<option ${x.technique===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>SENSAZIONE</label><select data-e="${ei}" data-s="${si}" data-k="feeling">${["Facile","Stabile","Impegnativo","Fiato corto","Presa debole","Stanchezza","Altro"].map(v=>`<option ${x.feeling===v?"selected":""}>${v}</option>`).join("")}</select></div></div></div>`).join("")}<div class="exercise-footer"><button class="ghost small" data-addset="${ei}">＋ Serie</button><button class="small" data-rest="${e.rest}">⏱ Recupero ${e.rest}s</button></div></div>`).join("")}
 <div class="card"><div class="exercise-name">Come ti senti oggi?</div><p class="muted tiny">Valuta sonno ed energia da 1 (molto male) a 5 (ottimo).</p><div class="grid2"><div class="field"><label>SONNO</label><select id="sleep">${[1,2,3,4,5].map(v=>`<option value="${v}" ${s.sleep==v?"selected":""}>${v} / 5</option>`).join("")}</select></div><div class="field"><label>ENERGIA</label><select id="energy">${[1,2,3,4,5].map(v=>`<option value="${v}" ${s.energy==v?"selected":""}>${v} / 5</option>`).join("")}</select></div></div><div class="field" style="margin-top:12px"><label>NOTE / FASTIDI</label><textarea id="sessionNotes" rows="2" placeholder="Tecnica, dolore, energia, osservazioni...">${esc(s.notes)}</textarea></div><button class="primary" id="finishWorkout" style="width:100%;margin-top:14px">Salva e termina allenamento</button></div><p class="note">I dati vengono salvati automaticamente su questo dispositivo. Esporta periodicamente un backup dalla sezione Storico.</p>`;
 $("#cancelSession").onclick=()=>{if(confirm("Annullare l'allenamento in corso? I dati non salvati di questa seduta verranno persi.")){state.active=null;save();renderWorkout()}};
 $("#sleep").onchange=e=>{s.sleep=Number(e.target.value);save()};$("#energy").onchange=e=>{s.energy=Number(e.target.value);save()};$("#sessionNotes").onchange=e=>{s.notes=e.target.value;save()};
 document.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("change",()=>{const e=s.exercises[+el.dataset.e],x=e.sets[+el.dataset.s];x[el.dataset.k]=el.value;save();if(el.dataset.k==="weight"||el.dataset.k==="reps"){updateWorkoutMetrics()} }));
 document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const [ei,si]=b.dataset.done.split(",").map(Number),x=s.exercises[ei].sets[si];if(x.weight===""||x.reps===""){toast("Inserisci carico e ripetizioni prima di completare");return}x.done=!x.done;save();renderWorkout();if(x.done){startTimer(s.exercises[ei].rest);}});
 document.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{const e=s.exercises[+b.dataset.addset];e.sets.push({weight:"",reps:"",rir:"2",effort:"3",technique:"Buona",feeling:"Stabile",done:false});save();renderWorkout()});
 document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest));
 document.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>{state.timerDuration=+b.dataset.timer;save();$("#timerHint").textContent="Durata selezionata: "+state.timerDuration+" secondi"});
 $("#timerStart").onclick=()=>startTimer(state.timerDuration||90);
 $("#finishWorkout").onclick=()=>{if(!confirm("Terminare e salvare questa seduta?"))return;s.endedAt=new Date().toISOString();state.sessions.push(s);state.active=null;state.timerEnd=null;save();toast("Allenamento salvato");renderWorkout()};
 updateTimerDisplay();
}
function updateWorkoutMetrics(){const s=state.active;if(!s)return;const ms=document.querySelectorAll(".metric strong");if(ms.length>=2){ms[0].textContent=doneSets(s)+"/"+allSets(s);ms[1].textContent=Math.round(activeVolume(s)).toLocaleString("it-IT")}}
function startTimer(seconds){state.timerEnd=Date.now()+seconds*1000;state.timerDuration=seconds;save();updateTimerDisplay();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerDisplay,250);if(page!=="workout")toast("Timer avviato")}
function updateTimerDisplay(){const el=$("#timerTime");if(!el)return;if(!state.timerEnd){el.textContent="--:--";return}const left=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));el.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");$("#timerHint").textContent=left===0?"Recupero completato":"Tempo di recupero";if(left===0&&timerInterval){clearInterval(timerInterval);timerInterval=null}}
function renderPlans(){
 $("#app").innerHTML=`<div class="section-title">Le tue schede</div><p class="sub">Personalizza gli esercizi assegnati dal trainer. I dati delle sedute già salvate non cambiano.</p><div class="stack">${state.plans.map(p=>`<div class="card"><div class="row between"><div class="grow"><div class="exercise-name">${esc(p.name)}</div><div class="muted tiny">${p.exercises.length} esercizi</div></div><button class="ghost small" data-editplan="${esc(p.id)}">Modifica</button></div>${p.exercises.slice(0,4).map(e=>`<div class="row between" style="padding-top:10px"><span>${esc(e.name)}</span><span class="muted tiny">${e.sets} × ${esc(e.reps)}</span></div>`).join("")}${p.exercises.length>4?`<div class="muted tiny" style="margin-top:8px">+ altri ${p.exercises.length-4} esercizi</div>`:""}</div>`).join("")}</div><button class="primary" style="width:100%;margin:12px 0 30px" id="addPlan">＋ Crea nuova scheda</button><div id="planEditor"></div>`;
 document.querySelectorAll("[data-editplan]").forEach(b=>b.onclick=()=>openPlanEditor(b.dataset.editplan));$("#addPlan").onclick=()=>openPlanEditor(null);
}
function openPlanEditor(id){editPlanId=id;const p=id?state.plans.find(p=>p.id===id):{id:uid(),name:"Scheda nuova",exercises:[]};const root=$("#planEditor");root.innerHTML=`<div class="card"><div class="row between"><div class="exercise-name">${id?"Modifica scheda":"Nuova scheda"}</div><button class="ghost small" id="closeEditor">Chiudi</button></div><div class="field" style="margin-top:12px"><label>NOME SCHEDA</label><input id="planName" value="${esc(p.name)}" maxlength="50"></div><div class="separator"></div><div id="exerciseEditor">${p.exercises.map((e,i)=>exerciseEditorRow(e,i)).join("")}</div><button class="ghost" id="addExercise" style="width:100%;margin-top:10px">＋ Aggiungi esercizio</button><button class="primary" id="savePlan" style="width:100%;margin-top:12px">Salva scheda</button>${id?'<button class="danger" id="deletePlan" style="width:100%;margin-top:8px">Elimina scheda</button>':""}</div>`;root.scrollIntoView({behavior:"smooth",block:"start"});
 $("#closeEditor").onclick=()=>root.innerHTML="";$("#addExercise").onclick=()=>{const list=$("#exerciseEditor"),i=list.children.length;list.insertAdjacentHTML("beforeend",exerciseEditorRow({id:uid(),name:"",sets:3,reps:"8-12",rest:90},i));};
 $("#savePlan").onclick=()=>{const name=$("#planName").value.trim();if(!name){toast("Inserisci il nome della scheda");return}const exercises=[...$("#exerciseEditor").querySelectorAll(".edit-ex")].map(row=>({id:row.dataset.id||uid(),name:row.querySelector('[data-field="name"]').value.trim(),sets:Math.max(1,Math.min(20,Number(row.querySelector('[data-field="sets"]').value)||3)),reps:row.querySelector('[data-field="reps"]').value.trim()||"libero",rest:Math.max(0,Number(row.querySelector('[data-field="rest"]').value)||90)})).filter(e=>e.name);if(!exercises.length){toast("Aggiungi almeno un esercizio");return}if(id){const target=state.plans.find(x=>x.id===id);target.name=name;target.exercises=exercises}else{const newId=uid();state.plans.push({id:newId,name,exercises});state.selectedPlan=newId}save();renderPlans();toast("Scheda salvata")};
 const del=$("#deletePlan");if(del)del.onclick=()=>{if(state.plans.length<=1){toast("Devi mantenere almeno una scheda");return}if(confirm("Eliminare questa scheda? Le sedute storiche restano salvate.")){state.plans=state.plans.filter(x=>x.id!==id);if(state.selectedPlan===id)state.selectedPlan=state.plans[0].id;save();renderPlans();toast("Scheda eliminata")}};
}
function exerciseEditorRow(e,i){return `<div class="edit-ex" data-id="${esc(e.id||"")}" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row between"><strong>Esercizio ${i+1}</strong><button class="danger small" type="button" onclick="this.closest('.edit-ex').remove()">Rimuovi</button></div><div class="field" style="margin-top:8px"><label>NOME ESERCIZIO</label><input data-field="name" value="${esc(e.name)}" placeholder="Es. Panca inclinata"></div><div class="grid2" style="margin-top:8px"><div class="field"><label>SERIE</label><input data-field="sets" type="number" min="1" max="20" value="${esc(e.sets)}"></div><div class="field"><label>RIPETIZIONI TARGET</label><input data-field="reps" value="${esc(e.reps)}" placeholder="8-12"></div><div class="field"><label>RECUPERO (SEC)</label><input data-field="rest" type="number" min="0" value="${esc(e.rest)}"></div></div></div>`}
function renderProgress(){
 const names=[...new Set(state.sessions.flatMap(s=>s.exercises.map(e=>e.name)))];
 $("#app").innerHTML=`<div class="section-title">I tuoi progressi</div><p class="sub">Confronta lo stesso esercizio nel tempo. Il volume è carico × ripetizioni e va interpretato insieme a tecnica e sforzo.</p>${names.length?`<div class="card"><div class="field"><label>ESERCIZIO DA ANALIZZARE</label><select id="progressExercise">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><div id="progressDetails"></div></div><div id="progressCharts"></div>`:`<div class="empty"><div class="emoji">↗</div><strong>Ancora nessun dato</strong><p>Completa e salva un allenamento per iniziare a vedere i grafici.</p><button class="primary" onclick="setPage('workout')">Vai all'allenamento</button></div>`}`;
 if(names.length){$("#progressExercise").onchange=drawProgress;drawProgress()}
}
function drawProgress(){const name=$("#progressExercise").value;const data=[];state.sessions.forEach(s=>{const e=s.exercises.find(e=>e.name===name);if(!e)return;const valid=e.sets.filter(x=>x.done&&x.weight!==""&&x.reps!=="");if(!valid.length)return;data.push({date:s.date,weight:Math.max(...valid.map(x=>+x.weight||0)),reps:valid.reduce((a,x)=>a+(+x.reps||0),0),volume:valid.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0),effort:valid.reduce((a,x)=>a+(+x.effort||0),0)/valid.length})});const d=$("#progressDetails"),c=$("#progressCharts");if(!data.length){d.innerHTML='<p class="muted">Nessuna serie completata per questo esercizio.</p>';c.innerHTML="";return}const latest=data[data.length-1],first=data[0],delta=latest.weight-first.weight;d.innerHTML=`<div class="grid2" style="margin-top:12px"><div class="metric"><strong>${latest.weight} kg</strong><span>carico massimo ultimo allenamento</span></div><div class="metric"><strong>${Math.round(latest.volume).toLocaleString("it-IT")} kg</strong><span>volume ultima seduta</span></div><div class="metric"><strong>${latest.reps}</strong><span>ripetizioni completate ultime sedute</span></div><div class="metric"><strong>${delta>0?"+":""}${delta} kg</strong><span>differenza carico vs prima seduta</span></div></div><p class="note" style="margin-top:12px">Il carico massimo è quello delle serie completate. Confronta anche ripetizioni, RIR e tecnica: non è un indicatore isolato di progresso.</p>`;
 c.innerHTML=chartCard("Carico massimo per seduta",data,"weight","kg")+chartCard("Volume per seduta",data,"volume","kg")+`<div class="chartbox"><strong>Sedute registrate</strong>${data.map(x=>`<div class="history-item"><div><strong>${fmtDate(x.date)}</strong><span class="muted tiny">${x.reps} ripetizioni · sforzo medio ${x.effort.toFixed(1)}/5</span></div><div style="text-align:right"><strong>${x.weight} kg</strong><span class="muted tiny">${Math.round(x.volume)} kg volume</span></div></div>`).join("")}</div>`
}
function chartCard(title,data,key,unit){const w=320,h=150,p=28,vals=data.map(x=>+x[key]||0),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const pts=vals.map((v,i)=>`${p+i*(w-2*p)/Math.max(1,vals.length-1)},${h-p-(v-min)*(h-2*p)/range}`).join(" ");return `<div class="chartbox"><div class="row between"><strong>${title}</strong><span class="muted tiny">${data.length} sedute</span></div><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${title}">${[0,1,2,3].map(i=>`<line x1="${p}" y1="${p+i*(h-2*p)/3}" x2="${w-p}" y2="${p+i*(h-2*p)/3}" stroke="#343842" stroke-width="1"/>`).join("")}<polyline points="${pts}" fill="none" stroke="#b9f36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${p+i*(w-2*p)/Math.max(1,vals.length-1)}" cy="${h-p-(v-min)*(h-2*p)/range}" r="4" fill="#b9f36b"/>`).join("")}<text x="${p}" y="14" fill="#a4a9b4" font-size="10">${max} ${unit}</text><text x="${p}" y="${h-5}" fill="#a4a9b4" font-size="10">${fmtDate(data[0].date)}</text><text x="${w-p}" y="${h-5}" fill="#a4a9b4" text-anchor="end" font-size="10">${fmtDate(data[data.length-1].date)}</text></svg></div>`}
function renderHistory(){
 const sessions=[...state.sessions].reverse();
 $("#app").innerHTML=`<div class="section-title">Storico</div><p class="sub">Le sedute concluse restano archiviate su questo telefono.</p><div class="grid2"><div class="metric"><strong>${state.sessions.length}</strong><span>sedute salvate</span></div><div class="metric"><strong>${Math.round(state.sessions.reduce((a,s)=>a+activeVolume(s),0)).toLocaleString("it-IT")}</strong><span>volume cumulativo · kg</span></div></div><div class="card"><div class="exercise-name">Backup ed esportazione</div><p class="muted tiny">Esporta i dati prima di cambiare telefono o cancellare i dati del browser.</p><div class="stack"><button class="primary" id="exportCsv">Esporta CSV (serie)</button><button id="exportJson">Backup completo JSON</button><label class="filelabel">Importa backup JSON<input id="importJson" type="file" accept=".json,application/json" class="hidden"></label></div></div><div class="card"><div class="exercise-name">Sedute precedenti</div>${sessions.length?sessions.map(s=>`<div class="history-item"><div class="grow"><strong>${esc(s.planName)} · ${fmtDate(s.date)}</strong><span class="muted tiny">${s.exercises.length} esercizi · ${doneSets(s)}/${allSets(s)} serie completate</span>${s.notes?`<div class="muted tiny" style="margin-top:4px">${esc(s.notes)}</div>`:""}</div><div style="text-align:right;white-space:nowrap"><strong>${Math.round(activeVolume(s)).toLocaleString("it-IT")}</strong><span class="muted tiny">kg volume</span><div><button class="ghost small" data-view="${s.id}" style="margin-top:6px">Dettagli</button></div></div></div>`).join(""):'<div class="empty">Nessun allenamento archiviato. Termina una seduta per trovarla qui.</div>'}</div>`;
 $("#exportCsv").onclick=exportCSV;$("#exportJson").onclick=()=>download("ferro-backup-"+today()+".json",JSON.stringify(state,null,2),"application/json");$("#importJson").onchange=importJSON;
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showSession(b.dataset.view));
}
function showSession(id){const s=state.sessions.find(s=>s.id===id);if(!s)return;const lines=s.exercises.map(e=>`<div class="history-item"><div><strong>${esc(e.name)}</strong><span class="muted tiny">${e.sets.filter(x=>x.done).length}/${e.sets.length} serie completate</span>${e.sets.filter(x=>x.done).map((x,i)=>`<div class="muted tiny">Serie ${i+1}: ${x.weight} kg × ${x.reps} · RIR ${x.rir} · sforzo ${x.effort}/5 · ${esc(x.technique)}</div>`).join("")}</div></div>`).join("");const dlg=document.createElement("div");dlg.style.cssText="position:fixed;inset:0;z-index:30;background:#101114f5;overflow:auto;padding:20px 16px";dlg.innerHTML=`<div style="max-width:650px;margin:0 auto"><div class="row between"><div><div class="section-title">${esc(s.planName)}</div><p class="sub">${fmtDate(s.date)}</p></div><button id="closeDetail">Chiudi</button></div><div class="grid2"><div class="metric"><strong>${Math.round(activeVolume(s))}</strong><span>volume kg</span></div><div class="metric"><strong>${totalReps(s)}</strong><span>ripetizioni totali</span></div></div><div class="card">${lines}<div class="separator"></div><p class="muted tiny">Sonno ${s.sleep}/5 · energia ${s.energy}/5</p><p>${esc(s.notes||"Nessuna nota")}</p></div><button class="danger" id="deleteSession" style="width:100%">Elimina questa seduta</button></div>`;document.body.appendChild(dlg);$("#closeDetail").onclick=()=>dlg.remove();$("#deleteSession").onclick=()=>{if(confirm("Eliminare definitivamente questa seduta?")){state.sessions=state.sessions.filter(x=>x.id!==id);save();dlg.remove();renderHistory();toast("Seduta eliminata")}}}
function download(filename,content,type){const blob=new Blob([content],{type:type+";charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[["data","scheda","esercizio","serie","carico_kg","ripetizioni","volume_kg","RIR","sforzo_1_5","tecnica","sensazione","sonno_1_5","energia_1_5","note_seduta"]];state.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>{if(x.weight!==""||x.reps!==""||x.done)rows.push([s.date,s.planName,e.name,i+1,x.weight,x.reps,(Number(x.weight)||0)*(Number(x.reps)||0),x.rir,x.effort,x.technique,x.feeling,s.sleep,s.energy,s.notes])})));const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");download("ferro-allenamenti-"+today()+".csv",csv,"text/csv");toast("CSV esportato")}
function importJSON(ev){const file=ev.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed.plans||!parsed.sessions)throw new Error("Formato non valido");if(!confirm("Importare il backup e sostituire i dati attuali? Esporta prima un backup se vuoi conservarli."))return;state={...structuredClone(defaultState),...parsed};save();renderHistory();toast("Backup importato")}catch(e){alert("Backup non valido o illeggibile.")}};reader.readAsText(file)}
$("#todayLabel").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
render();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body></html>
